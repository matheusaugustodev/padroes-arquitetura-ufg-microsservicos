spring.application.name=estoque-service
server.port=8080

# Valores padrao para execucao local; no Docker Compose sao sobrescritos por variaveis de ambiente
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque
spring.datasource.username=estoque
spring.datasource.password=estoque

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
