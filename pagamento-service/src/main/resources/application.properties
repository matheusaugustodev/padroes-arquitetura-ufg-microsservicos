spring.application.name=pagamento-service

# Valores padrao para execucao local; no Docker Compose sao sobrescritos por variaveis de ambiente
spring.datasource.url=jdbc:postgresql://localhost:5434/pagamento
spring.datasource.username=pagamento
spring.datasource.password=pagamento
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# prefetch=1: cada instancia pega UMA mensagem por vez -> distribuicao equilibrada ao escalar
spring.rabbitmq.listener.simple.prefetch=1
# Em caso de erro: 3 tentativas; depois a mensagem vai para a DLQ pedido.criado.dlq
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Tempo artificial de processamento (ms) - deixa visivel a fila enchendo e a distribuicao entre instancias
pagamento.tempo-processamento-ms=1000
# Percentual de aprovacao (Etapa 6: ~80%)
pagamento.taxa-aprovacao=0.8
# Investigacao de incidente: id de um pedido cujo pagamento deve falhar (vazio = desligado)
simulacao.falhar-pedido-id=

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
