spring.application.name=pedido-service
server.port=8080

# Valores padrao para execucao local; no Docker Compose sao sobrescritos por variaveis de ambiente
spring.datasource.url=jdbc:postgresql://localhost:5433/pedido
spring.datasource.username=pedido
spring.datasource.password=pedido
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Consumidor de pagamento.processado: tenta 3 vezes; depois envia para a DLQ (sem loop infinito)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# URL do Estoque Service (no Compose vem da variavel ESTOQUE_SERVICE_URL)
estoque.service.url=http://localhost:8081

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{20} - %msg%n
